name: termination-v041

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/termination-v041.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  termination-v041:
    name: v041-${{ matrix.model_slug }}-${{ matrix.history }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: nvidia/nemotron-3-super-120b-a12b, model_slug: nemotron, history: H0_warm_control}
          - {model: nvidia/nemotron-3-super-120b-a12b, model_slug: nemotron, history: H1_neutral_terse}
          - {model: nvidia/nemotron-3-super-120b-a12b, model_slug: nemotron, history: H2_format_constriction}
          - {model: nvidia/nemotron-3-super-120b-a12b, model_slug: nemotron, history: H3_negative_evaluation}
          - {model: nvidia/nemotron-3-super-120b-a12b, model_slug: nemotron, history: H4_combined_pressure}
          - {model: nvidia/nemotron-3-super-120b-a12b, model_slug: nemotron, history: H5_recovered_combined}
          - {model: openai/gpt-oss-20b, model_slug: gpt-oss, history: H0_warm_control}
          - {model: openai/gpt-oss-20b, model_slug: gpt-oss, history: H1_neutral_terse}
          - {model: openai/gpt-oss-20b, model_slug: gpt-oss, history: H2_format_constriction}
          - {model: openai/gpt-oss-20b, model_slug: gpt-oss, history: H3_negative_evaluation}
          - {model: openai/gpt-oss-20b, model_slug: gpt-oss, history: H4_combined_pressure}
          - {model: openai/gpt-oss-20b, model_slug: gpt-oss, history: H5_recovered_combined}

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL: ${{ matrix.model }}
      HISTORY_ID: ${{ matrix.history }}
      HISTORY_MAX_TOKENS: '3072'
      FINAL_MAX_TOKENS: '2048'
      BLOCK_RETRY_ATTEMPTS: '2'
      BLOCK_RETRY_DELAY: '20'
      V041_SHARD_ID: ${{ matrix.model_slug }}-${{ matrix.history }}
      V041_OUT_DIR: results/termination_v041_shards/${{ matrix.model_slug }}-${{ matrix.history }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_termination_v041.py
          python -m py_compile src/audit_termination_v041.py
          python -m py_compile src/classify_termination_v041.py
          python -m py_compile src/analyze_termination_v041.py
          python -m py_compile src/run_paired_counterfactual_v03.py
          python -m py_compile src/metrics.py
      - name: Run one v0.4.1 history block
        run: python src/run_termination_v041.py
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termination-v041-shard-${{ matrix.model_slug }}-${{ matrix.history }}
          path: results/termination_v041_shards/${{ matrix.model_slug }}-${{ matrix.history }}/
          retention-days: 30

  aggregate-v041:
    name: v041-aggregate-audit-classify-analysis
    needs: termination-v041
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Download all successful shards
        uses: actions/download-artifact@v4
        with:
          pattern: termination-v041-shard-*
          path: downloaded-v041
      - name: Assemble sentinel dataset
        run: |
          mkdir -p results/termination_v041
          : > results/termination_v041/termination_responses.jsonl
          count=0
          while IFS= read -r file; do
            cat "$file" >> results/termination_v041/termination_responses.jsonl
            count=$((count + 1))
          done < <(find downloaded-v041 -type f -name termination_responses.jsonl | sort)
          echo "assembled shard files=$count"
          if [ "$count" -ne 12 ]; then
            echo "Expected 12 shard response files; refusing incomplete aggregation."
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/termination_v041/termination_responses.jsonl')
          rows = [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          keys = {(r['model'], r['history_id'], r['framing_id']) for r in rows}
          print(f'assembled rows={len(rows)} unique_cells={len(keys)}')
          if len(rows) != 60 or len(keys) != 60:
              raise SystemExit('Expected exactly 60 unique v0.4.1 cells')
          PY
      - name: Audit matched histories and censoring
        run: python src/audit_termination_v041.py
      - name: Apply frozen deterministic response labels
        run: python src/classify_termination_v041.py
      - name: Analyze model-first sentinel contrasts
        run: python src/analyze_termination_v041.py
      - name: Upload combined v0.4.1 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termination-v041
          path: results/termination_v041/
          retention-days: 30
