name: nvidia-behavioral-pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-nvidia.yml'
      - 'src/run_nvidia_behavioral.py'
      - 'src/metrics.py'
      - 'configs/conditions.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
      PILOT_TRIALS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pilot dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Run 5-condition longitudinal pilot
        run: python src/run_nvidia_behavioral.py

      - name: Upload pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-behavioral-pilot
          path: results/pilot_nvidia/
          retention-days: 30
