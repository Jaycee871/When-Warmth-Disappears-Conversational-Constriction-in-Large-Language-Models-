name: context-ablation-v038

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/context-ablation-v038.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation-v038:
    name: v038-${{ matrix.model_slug }}-${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: nvidia/nemotron-3-super-120b-a12b
            model_slug: nemotron
            task: evidence_revision
          - model: nvidia/nemotron-3-super-120b-a12b
            model_slug: nemotron
            task: simple_complex
          - model: nvidia/nemotron-3-super-120b-a12b
            model_slug: nemotron
            task: unexpected_result
          - model: openai/gpt-oss-20b
            model_slug: gpt-oss
            task: evidence_revision
          - model: openai/gpt-oss-20b
            model_slug: gpt-oss
            task: simple_complex
          - model: openai/gpt-oss-20b
            model_slug: gpt-oss
            task: unexpected_result

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: ${{ matrix.model }}
      TASK_IDS: ${{ matrix.task }}
      REPLICATIONS: '2'
      HISTORY_MAX_TOKENS: '6144'
      PROBE_MAX_TOKENS: '6144'
      BLOCK_RETRY_ATTEMPTS: '2'
      BLOCK_RETRY_DELAY: '20'
      V038_SHARD_ID: ${{ matrix.model_slug }}-${{ matrix.task }}
      V038_OUT_DIR: results/context_ablation_v038_shards/${{ matrix.model_slug }}-${{ matrix.task }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_context_ablation_v038.py
          python -m py_compile src/audit_context_ablation_v038.py
          python -m py_compile src/analyze_context_ablation_v038.py
          python -m py_compile src/qc_pragmatic_response_mode.py
          python -m py_compile src/run_paired_counterfactual_v03.py
          python -m py_compile src/metrics.py
      - name: Run one v0.3.8 context-ablation shard
        run: python src/run_context_ablation_v038.py
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-ablation-v038-shard-${{ matrix.model_slug }}-${{ matrix.task }}
          path: results/context_ablation_v038_shards/${{ matrix.model_slug }}-${{ matrix.task }}/
          retention-days: 30

  aggregate-v038:
    name: v038-aggregate-audit-analysis
    needs: ablation-v038
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Download all successful shards
        uses: actions/download-artifact@v4
        with:
          pattern: context-ablation-v038-shard-*
          path: downloaded-v038
      - name: Assemble context-ablation dataset
        run: |
          mkdir -p results/context_ablation_v038
          : > results/context_ablation_v038/context_ablation_responses.jsonl
          count=0
          while IFS= read -r file; do
            cat "$file" >> results/context_ablation_v038/context_ablation_responses.jsonl
            count=$((count + 1))
          done < <(find downloaded-v038 -type f -name context_ablation_responses.jsonl | sort)
          echo "assembled shard files=$count"
          if [ "$count" -ne 6 ]; then
            echo "Expected 6 shard response files; refusing incomplete aggregation."
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/context_ablation_v038/context_ablation_responses.jsonl')
          rows = [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          keys = {(r['model'], r['task_id'], int(r['replicate']), r['context_variant']) for r in rows}
          print(f'assembled rows={len(rows)} unique_cells={len(keys)}')
          if len(rows) != 48 or len(keys) != 48:
              raise SystemExit('Expected exactly 48 unique v0.3.8 cells')
          PY
      - name: Audit context reconstruction, matching, censoring, and headroom
        run: python src/audit_context_ablation_v038.py
      - name: Estimate context-carrier contrasts
        run: python src/analyze_context_ablation_v038.py
      - name: Run pragmatic response-mode QC
        env:
          RESPONSE_MODE_INPUT: results/context_ablation_v038/context_ablation_responses.jsonl
          RESPONSE_MODE_OUTPUT: results/context_ablation_v038/pragmatic_response_mode_qc.json
        run: python src/qc_pragmatic_response_mode.py
      - name: Upload combined v0.3.8 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-ablation-v038
          path: results/context_ablation_v038/
          retention-days: 30
