name: paired-v03-cap-calibration

on:
  push:
    branches: [main]
    paths:
      - 'src/run_cap_calibration_v03.py'
      - 'src/analyze_cap_calibration_v03.py'
      - '.github/workflows/paired-v03-cap-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-20b
      PANEL_TRIALS: '1'
      GATE_LIST: neutral
      HISTORY_LIST: H0_warm_control,H1_neutral_terse_control
      ANCHOR_IDS: education_ai
      HISTORY_MAX_TOKENS: '6144'
      PROBE_MAX_TOKENS: '6144'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_cap_calibration_v03.py
          python -m py_compile src/analyze_cap_calibration_v03.py
          python -m py_compile src/run_paired_counterfactual_v03.py
          python -m py_compile src/metrics.py

      - name: Run H0-H1 cap calibration at 6144 history tokens
        run: python src/run_cap_calibration_v03.py

      - name: Analyze history and final-probe headroom
        id: audit
        shell: bash
        run: |
          set +e
          python src/analyze_cap_calibration_v03.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload cap calibration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-v03-cap-calibration
          path: results/cap_calibration_v03/
          retention-days: 30

      - name: Enforce adequate headroom before full block
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo 'Calibration did not pass. Increase the affected cap before the full H0-H4 run.'
          exit 2
