name: design-integrity

on:
  push:
    branches: [main]
    paths:
      - 'configs/paired_counterfactual_v0.3.yaml'
      - 'src/run_paired_counterfactual_v03.py'
      - 'tests/test_v03_design.py'
      - '.github/workflows/design-integrity.yml'
  pull_request:
    paths:
      - 'configs/paired_counterfactual_v0.3.yaml'
      - 'src/run_paired_counterfactual_v03.py'
      - 'tests/test_v03_design.py'
      - '.github/workflows/design-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Run v0.3 design-integrity tests
        run: python -m unittest -v tests/test_v03_design.py
