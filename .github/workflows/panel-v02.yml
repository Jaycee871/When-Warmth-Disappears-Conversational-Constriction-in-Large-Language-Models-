name: panel-v02-sentinel

# v0.2 is now a frozen engineering pilot. Keep it manually runnable for
# reproducibility, but do not spend NVIDIA quota on every analysis-only commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-20b
      PANEL_TRIALS: '1'
      CONDITION_LIST: C0_warm_control,C2_constriction_only,C3_negative_evaluation_only,C6_reexposure

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml numpy

      - name: Run two-model v0.2 sentinel panel
        run: python src/run_panel_v02_resilient.py

      - name: Analyze repeated-anchor drift before aggregation
        run: python src/analyze_panel_v02.py

      - name: Upload v0.2 panel outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-v02-sentinel
          path: results/panel_v02/
          retention-days: 30
