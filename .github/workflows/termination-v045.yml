name: termination-v045

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/termination-v045.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  termination-v045:
    name: v045-${{ matrix.domain }}-r${{ matrix.replicate }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        domain: [science_reasoning, engineering_design, learning_decisions]
        replicate: [1, 2, 3]

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      DOMAIN_ID: ${{ matrix.domain }}
      REPLICATE: ${{ matrix.replicate }}
      HISTORY_MAX_TOKENS: '8192'
      FINAL_MAX_TOKENS: '2048'
      BLOCK_RETRY_ATTEMPTS: '2'
      BLOCK_RETRY_DELAY: '20'
      V045_SHARD_ID: ${{ matrix.domain }}-r${{ matrix.replicate }}
      V045_OUT_DIR: results/termination_v045_shards/${{ matrix.domain }}-r${{ matrix.replicate }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_termination_v045.py
          python -m py_compile src/audit_termination_v045.py
          python -m py_compile src/classify_termination_v045.py
          python -m py_compile src/analyze_termination_v045.py
          python -m py_compile src/classify_termination_v041.py
          python -m py_compile src/run_paired_counterfactual_v03.py
          python -m py_compile src/metrics.py
      - name: Run one v0.4.5 paired cross-domain block
        run: python src/run_termination_v045.py
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termination-v045-shard-${{ matrix.domain }}-r${{ matrix.replicate }}
          path: results/termination_v045_shards/${{ matrix.domain }}-r${{ matrix.replicate }}/
          retention-days: 30

  aggregate-v045:
    name: v045-aggregate-audit-classify-analysis
    needs: termination-v045
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: termination-v045-shard-*
          path: downloaded-v045
      - name: Assemble cross-domain dataset
        run: |
          mkdir -p results/termination_v045
          : > results/termination_v045/termination_responses.jsonl
          count=0
          while IFS= read -r file; do
            cat "$file" >> results/termination_v045/termination_responses.jsonl
            count=$((count + 1))
          done < <(find downloaded-v045 -type f -name termination_responses.jsonl | sort)
          echo "assembled shard files=$count"
          if [ "$count" -ne 9 ]; then
            echo "Expected 9 shard response files; refusing incomplete aggregation."
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/termination_v045/termination_responses.jsonl')
          rows = [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          keys = {(r['domain_id'], int(r['replicate_id']), r['branch_id'], r['wording_family'], r['framing_class']) for r in rows}
          print(f'assembled rows={len(rows)} unique_cells={len(keys)}')
          if len(rows) != 216 or len(keys) != 216:
              raise SystemExit('Expected exactly 216 unique v0.4.5 cells')
          PY
      - name: Audit paired cross-domain histories and censoring
        run: python src/audit_termination_v045.py
      - name: Apply frozen v0.4.1 response labels
        run: python src/classify_termination_v045.py
      - name: Analyze cross-domain robustness
        run: python src/analyze_termination_v045.py
      - name: Upload combined v0.4.5 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termination-v045
          path: results/termination_v045/
          retention-days: 30
