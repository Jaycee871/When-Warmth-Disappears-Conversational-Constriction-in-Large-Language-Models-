name: paired-v03-confirmatory-panel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-20b
      PANEL_TRIALS: '3'
      GATE_LIST: neutral
      HISTORY_LIST: H0_warm_control,H1_neutral_terse_control,H2_format_constriction,H4_combined_history
      ANCHOR_IDS: education_ai,scientific_models,automation_decisions
      HISTORY_MAX_TOKENS: '6144'
      PROBE_MAX_TOKENS: '6144'
      PANEL_MIN_VALID: '3'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_paired_highcap_v03.py
          python -m py_compile src/audit_output_censoring_v03.py
          python -m py_compile src/analyze_paired_counterfactual_v03.py
          python -m py_compile src/analyze_confirmatory_panel_v03.py
          python -m py_compile src/metrics.py

      - name: Run three-anchor neutral confirmation panel
        run: python src/run_paired_highcap_v03.py

      - name: Audit censoring and token headroom
        id: censoring
        shell: bash
        run: |
          set +e
          python src/audit_output_censoring_v03.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compute paired effects
        if: steps.censoring.outputs.exit_code == '0'
        run: python src/analyze_paired_counterfactual_v03.py

      - name: Evaluate model-level replication across anchors
        if: steps.censoring.outputs.exit_code == '0'
        run: python src/analyze_confirmatory_panel_v03.py

      - name: Upload confirmatory panel outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-v03-confirmatory-panel
          path: results/paired_v03/
          retention-days: 30

      - name: Enforce validity gate
        if: steps.censoring.outputs.exit_code != '0'
        run: |
          echo 'Confirmatory panel contains censoring/headroom failure. Withhold replication interpretation.'
          exit 2
