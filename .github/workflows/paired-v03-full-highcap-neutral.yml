name: paired-v03-full-highcap-neutral

on:
  workflow_run:
    workflows: ["paired-v03-cap-calibration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-highcap:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-20b
      PANEL_TRIALS: '1'
      GATE_LIST: neutral
      HISTORY_LIST: H0_warm_control,H1_neutral_terse_control,H2_format_constriction,H3_negative_evaluation,H4_combined_history
      ANCHOR_IDS: education_ai
      HISTORY_MAX_TOKENS: '6144'
      PROBE_MAX_TOKENS: '6144'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_paired_highcap_v03.py
          python -m py_compile src/analyze_paired_counterfactual_v03.py
          python -m py_compile src/audit_output_censoring_v03.py
          python -m py_compile src/metrics.py

      - name: Run high-cap matched-current-prompt H0-H4 block
        run: python src/run_paired_highcap_v03.py

      - name: Audit history and final-probe censoring before effects
        id: censoring
        shell: bash
        run: |
          set +e
          python src/audit_output_censoring_v03.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyze paired counterfactual before pooling
        if: steps.censoring.outputs.exit_code == '0'
        run: python src/analyze_paired_counterfactual_v03.py

      - name: Upload high-cap v0.3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-v03-full-highcap-neutral
          path: results/paired_v03/
          retention-days: 30

      - name: Enforce censoring gate
        if: steps.censoring.outputs.exit_code != '0'
        run: |
          echo 'High-cap block still contains right-censoring. Do not interpret response-length effects.'
          exit 2
