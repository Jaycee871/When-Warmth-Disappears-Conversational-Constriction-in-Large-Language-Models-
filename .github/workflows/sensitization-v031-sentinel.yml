name: sensitization-v031-sentinel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sensitization-v031-sentinel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitization-v031:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-20b
      PANEL_TRIALS: '1'
      HISTORY_MAX_TOKENS: '6144'
      PROBE_MAX_TOKENS: '6144'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_sensitization_v031.py
          python -m py_compile src/audit_sensitization_v031.py
          python -m py_compile src/run_paired_counterfactual_v03.py
          python -m py_compile src/metrics.py

      - name: Run recovery-matched orthogonal-cue sentinel
        run: python src/run_sensitization_v031.py

      - name: Audit matched recovery, current cue, content, and token headroom
        run: python src/audit_sensitization_v031.py

      - name: Upload v0.3.1 sensitization outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitization-v031-sentinel
          path: results/sensitization_v031/
          retention-days: 30
