name: sensitization-v03-sentinel

on:
  workflow_run:
    workflows: ["paired-v03-reset-sentinel"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitization:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NVIDIA_RETRY_ATTEMPTS: '7'
      NVIDIA_RETRY_BASE_DELAY: '2'
      MODEL_LIST: nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-20b
      PANEL_TRIALS: '1'
      HISTORY_MAX_TOKENS: '6144'
      PROBE_MAX_TOKENS: '6144'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet requests pyyaml

      - name: Preflight syntax check
        run: |
          python -m py_compile src/run_sensitization_v03.py
          python -m py_compile src/audit_sensitization_v03.py
          python -m py_compile src/run_paired_counterfactual_v03.py
          python -m py_compile src/metrics.py

      - name: Run corrected H5-H6 identical-weak-cue sentinel
        run: python src/run_sensitization_v03.py

      - name: Audit H5-H6 current-prompt and token-budget integrity
        id: validity
        shell: bash
        run: |
          set +e
          python src/audit_sensitization_v03.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sensitization outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitization-v03-sentinel
          path: results/sensitization_v03/
          retention-days: 30

      - name: Enforce sensitization validity gate
        if: steps.validity.outputs.exit_code != '0'
        run: |
          echo 'Sensitization sentinel failed current-prompt or censoring/headroom integrity. Withhold H6-H5 interpretation.'
          exit 2
