name: nvidia-model-inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nvidia-models.yml'
      - 'scripts/list_nvidia_models.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - name: List accessible NVIDIA-hosted models
        run: python scripts/list_nvidia_models.py
