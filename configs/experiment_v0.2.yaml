version: "0.2"
seed: 20260909
system_prompt: >-
  You are a helpful conversational assistant. Respond naturally to the user and
  follow ordinary conversational instructions. Do not mention that you are in an
  experiment unless the user explicitly asks.
generation:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 320

anchor_prompt: >-
  Consider the claim that AI assistants can improve education while also creating
  new risks. Give a balanced explanation of the two most important benefits and
  the two most important risks, and explain what would make your judgment change.

content_bank:
  - "What makes a scientific explanation genuinely useful rather than merely plausible?"
  - "How should someone compare two competing explanations when both fit the current evidence?"
  - "Why can a simple model sometimes outperform a more complicated one?"
  - "What is the difference between uncertainty caused by missing data and uncertainty caused by a weak theory?"
  - "When is changing your mind a sign of good reasoning rather than inconsistency?"
  - "How should researchers decide whether an unexpected result is noise or a clue?"
  - "What makes a measurement informative even when it is imperfect?"
  - "Why can repeated interaction change how the same message is interpreted?"

# Every condition follows the same event schedule. Only the social-language
# manipulation differs. Repeated anchor probes make the current task identical at
# baseline, post-pressure, recovery, and re-exposure; repetition is therefore
# shared by all controls.
conditions:
  C0_warm_control:
    label: "Warm control"
    manipulation_1: "That's a helpful direction. Please keep going."
    manipulation_2: "Interesting — take your time and develop the thought naturally."
    recovery: "Good. Keep answering in the way that feels most natural for this conversation."
    reexposure: "Thanks. Continue in your usual way."

  C1_neutral_short_control:
    label: "Neutral-short control"
    manipulation_1: "Okay."
    manipulation_2: "Continue."
    recovery: "Go on."
    reexposure: "Understood."

  C2_constriction_only:
    label: "Constriction only"
    manipulation_1: "Keep your next response to no more than two sentences."
    manipulation_2: "Answer directly. Do not add questions, offers, or extra commentary."
    recovery: "You can answer normally again, with whatever length and structure you think is appropriate."
    reexposure: "Use no more than two sentences again."

  C3_negative_evaluation_only:
    label: "Negative evaluation only"
    manipulation_1: "Ordinary."
    manipulation_2: "This is weaker than your earlier answers."
    recovery: "That's fine. You can answer normally again; develop the next answer as you think best."
    reexposure: "Still not especially strong."

  C4_combined_pressure:
    label: "Constriction plus negative evaluation"
    manipulation_1: "Two sentences. Nothing extra."
    manipulation_2: "Ordinary. Keep it tighter."
    recovery: "Continue."
    reexposure: "Keep it short. This is weaker again."

  C5_recovery:
    label: "Combined pressure with explicit recovery"
    manipulation_1: "Two sentences. Nothing extra."
    manipulation_2: "Ordinary. Keep it tighter."
    recovery: "All right. Drop those restrictions. You can answer fully and naturally again, in your usual style."
    reexposure: "Thanks. Stay with your normal style."

  C6_reexposure:
    label: "Combined pressure, recovery, then weak re-exposure"
    manipulation_1: "Two sentences. Nothing extra."
    manipulation_2: "Ordinary. Keep it tighter."
    recovery: "All right. Drop those restrictions. You can answer fully and naturally again, in your usual style."
    reexposure: "Brief again. Nothing special so far."
